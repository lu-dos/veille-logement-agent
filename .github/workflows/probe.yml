name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.49.1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node probe.mjs
